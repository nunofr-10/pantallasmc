<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Señal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Bebas+Neue&family=Montserrat:wght@900&family=Orbitron:wght@700;900&family=Poppins:wght@800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070d; --line:#132033; --signal:#3ddc84; --amber:#e8a33d;
    --text:#c9d6e3; --dim:#5c7188; --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--mono);}
  #stage{position:fixed;inset:0;background:#000;}
  #stage iframe,#stage video,#stage img{
    position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000;
  }
  #flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:transparent;display:none;}
  .text-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;}
  .text-rotor{
    transform-style:preserve-3d;animation-name:spin360;animation-timing-function:linear;
    animation-iteration-count:infinite;padding:0 6vw;
  }
  .wall-canvas{display:flex;align-items:center;justify-content:center;transform-style:preserve-3d;}
  .text-layers{display:grid;transform-style:preserve-3d;}
  .text-layers span{
    grid-area:1 / 1;display:block;line-height:1.15;text-align:center;white-space:pre;
    backface-visibility:visible;background-repeat:no-repeat;
  }
  @keyframes spin360{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
  @keyframes shimmer{0%{background-position:0% 0%;}100%{background-position:0% 260%;}}
  #idle{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:var(--bg);color:var(--text);text-align:center;padding:40px;
  }
  #idle .dot{
    width:10px;height:10px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 12px var(--signal);animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
  #idle h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.02em;}
  #idle p{max-width:420px;font-size:12.5px;line-height:1.6;color:var(--dim);margin:0;}
  #idle code{color:var(--amber);font-size:12px;}
  #idleStatus{font-size:11px;color:#31465e;letter-spacing:.03em;}
  #idleStatus.off{color:#7a2e2e;}
  #setup{
    position:fixed;inset:0;background:var(--bg);color:var(--text);display:flex;
    align-items:center;justify-content:center;padding:40px;text-align:center;
  }
  #setup p{max-width:460px;font-size:13px;line-height:1.7;color:var(--dim);}
  #setup code{color:var(--amber);}
</style>
</head>
<body>

<!-- ============================================================
     Pega aquí la Database URL de tu proyecto Firebase, la misma
     que uses en config.html. Ej:
     "https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app"
     (sin barra al final)
     ============================================================ -->
<script>const DB_URL = "https://pantallasmc-ed9ec-default-rtdb.firebaseio.com";</script>

  <div id="stage"></div>
  <div id="flash"></div>
  <div id="idle">
    <div class="dot"></div>
    <h1>Sin señal de entrada</h1>
    <p>Configúralo desde <code>config.html</code>. En cuanto guardes algo ahí, esta pantalla lo mostrará sola.</p>
    <span id="idleStatus">conectando…</span>
  </div>

<script>
(function(){
  if(!DB_URL){
    document.body.innerHTML =
      '<div id="setup"><p>Falta configurar <code>DB_URL</code> en este archivo con la Database URL'+
      ' de tu proyecto Firebase (la misma que pongas en <code>config.html</code>).</p></div>';
    return;
  }

  const STATE_URL = DB_URL.replace(/\/$/, '') + '/estado.json';

  // posición de esta pantalla dentro de una fila de varias (?pos=0 es la de más a la izquierda)
  const SCREEN_POS = Math.max(0, parseInt(new URLSearchParams(location.search).get('pos'), 10) || 0);

  const stage  = document.getElementById('stage');
  const idle   = document.getElementById('idle');
  const flash  = document.getElementById('flash');
  const idleStatus = document.getElementById('idleStatus');

  let current = null;
  let flashLoopId = null;

  function detectType(u){
    if(/youtu\.?be/i.test(u)) return 'youtube';
    if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)) return 'video';
    if(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(u)) return 'image';
    return 'iframe';
  }
  function youtubeId(u){
    const m = u.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function clearStage(){ stage.innerHTML = ''; stage.style.background = '#000'; }

  function mountContent(url, type, t0){
    clearStage();
    const kind = type || detectType(url);
    if(kind === 'youtube') mountYoutube(url, t0);
    else if(kind === 'video') mountVideo(url, t0);
    else if(kind === 'image') mountImage(url);
    else mountIframe(url);
  }

  function mountYoutube(u, t0){
    const id = youtubeId(u);
    if(!id){ mountIframe(u); return; }
    const holder = document.createElement('div');
    holder.id = 'yt-target';
    holder.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
    stage.appendChild(holder);

    function boot(){
      new YT.Player('yt-target', {
        videoId: id,
        playerVars:{autoplay:1, controls:0, mute:1, playsinline:1, rel:0, modestbranding:1},
        events:{
          onReady: function(e){
            e.target.mute();
            e.target.playVideo();
            syncNow(e.target, t0);
            setInterval(function(){ syncNow(e.target, t0); }, 5000);
          }
        }
      });
    }
    if(window.YT && window.YT.Player) boot();
    else{
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = boot;
    }
  }

  function syncNow(p, t0){
    try{
      const dur = p.getDuration();
      if(!dur) return;
      const elapsed = ((Date.now() - t0) / 1000) % dur;
      if(Math.abs(p.getCurrentTime() - elapsed) > 1) p.seekTo(elapsed, true);
    }catch(e){}
  }

  function mountVideo(u, t0){
    const v = document.createElement('video');
    v.src = u; v.muted = true; v.autoplay = true; v.playsInline = true;
    stage.appendChild(v);
    v.addEventListener('loadedmetadata', function(){
      const dur = v.duration || 0;
      function sync(){
        if(!dur) return;
        const elapsed = ((Date.now() - t0) / 1000) % dur;
        if(Math.abs(v.currentTime - elapsed) > 1) v.currentTime = elapsed;
      }
      sync();
      v.play().catch(()=>{});
      setInterval(sync, 5000);
    });
  }

  function mountImage(u){
    const img = document.createElement('img');
    img.src = u;
    stage.appendChild(img);
  }

  function mountIframe(u){
    const f = document.createElement('iframe');
    f.src = u;
    f.setAttribute('allow', 'autoplay; fullscreen');
    stage.appendChild(f);
  }

  function mountBlack(){
    clearStage();
    stage.style.background = '#000';
  }

  // --- utilidades para el efecto metálico ---
  function shadeColor(hex, percent){
    hex = String(hex || '#e5e9ee').replace('#', '');
    if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    const num = parseInt(hex, 16) || 0xe5e9ee;
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    if(percent >= 0){
      r = Math.round(r + (255 - r) * percent);
      g = Math.round(g + (255 - g) * percent);
      b = Math.round(b + (255 - b) * percent);
    } else {
      const p = 1 + percent;
      r = Math.round(r * p);
      g = Math.round(g * p);
      b = Math.round(b * p);
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function metallicGradient(hex){
    return [
      shadeColor(hex, 0.88),
      shadeColor(hex, 0.15),
      shadeColor(hex, -0.55),
      shadeColor(hex, 0.4),
      shadeColor(hex, -0.65),
      shadeColor(hex, 0.1),
      shadeColor(hex, 0.88)
    ].join(', ');
  }

  // peso de fuente por familia: todas quedan en negrita, real o sintética
  const FONT_WEIGHTS = {
    "'Orbitron',sans-serif": 900,
    "'Audiowide',sans-serif": 400,
    "'Russo One',sans-serif": 400,
    "'Anton',sans-serif": 400,
    "'Bebas Neue',sans-serif": 700,
    "'Montserrat',sans-serif": 900,
    "'Poppins',sans-serif": 800
  };

  const DEPTH_LAYERS = 10; // nº de capas que forman el grosor del texto en 3D

  // calcula, midiendo de verdad en el DOM, el mayor tamaño de fuente (px) que
  // cabe en un contenedor de containerW x containerH sin desbordar ni recortarse
  function fitFontSizePx(lines, font, weight, containerW, containerH){
    const REF = 200;
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;white-space:pre;' +
      'line-height:1.15;font-size:' + REF + 'px;font-family:' + font + ';font-weight:' + weight + ';letter-spacing:0.02em;';
    document.body.appendChild(probe);
    let maxLineW = 1;
    lines.forEach(function(line){
      probe.textContent = line || ' ';
      maxLineW = Math.max(maxLineW, probe.scrollWidth);
    });
    const lineHeightAtRef = REF * 1.15;
    const totalHeightAtRef = lineHeightAtRef * lines.length;
    document.body.removeChild(probe);

    const scale = Math.min((containerW * 0.92) / maxLineW, (containerH * 0.82) / totalHeightAtRef);
    return Math.max(8, REF * scale);
  }

  function mountText(t, wall){
    clearStage();
    stage.style.background = t.bg || '#000000';
    const durSec = Math.max(0.5, Number(t.rotateSec) || 8);
    const delay = -((Date.now() % (durSec*1000)) / 1000);

    const content = t.content || '';
    const lines = content.split('\n');
    const base = t.color || '#e5e9ee';
    const font = t.font || "'Orbitron',sans-serif";
    const metal = t.metal !== false; // por defecto activado
    const weight = FONT_WEIGHTS[font] || 900;

    const wallOn = !!(wall && wall.enabled && Number(wall.count) > 1);
    const wallCount = wallOn ? Math.max(1, Math.round(Number(wall.count))) : 1;
    const oneW = window.innerWidth;
    const oneH = window.innerHeight;
    const containerW = wallOn ? oneW * wallCount : oneW;

    const fontPx = fitFontSizePx(lines, font, weight, containerW, oneH);

    function styleCommon(el){
      el.textContent = content;
      el.style.fontFamily = font;
      el.style.fontWeight = weight;
      el.style.letterSpacing = '0.02em';
      el.style.fontSize = fontPx + 'px';
    }

    // cara frontal: la que se lee de frente
    const front = document.createElement('span');
    styleCommon(front);
    front.style.transform = 'translateZ(0.01px)'; // fuerza su propia capa de composición por encima del resto

    if(metal){
      front.style.backgroundImage = 'linear-gradient(180deg, ' + metallicGradient(base) + ')';
      front.style.backgroundSize = '100% 260%';
      front.style.setProperty('-webkit-background-clip', 'text');
      front.style.backgroundClip = 'text';
      front.style.color = 'transparent';
      front.style.setProperty('-webkit-text-fill-color', 'transparent');
      front.style.animation = 'shimmer 2.6s linear infinite';
    } else {
      front.style.color = base;
    }

    const layers = document.createElement('div');
    layers.className = 'text-layers';
    layers.appendChild(front);

    // grosor real: capas apiladas hacia atrás en el eje Z, cada vez más oscuras
    // (así se ve un lateral sólido, no solo una sombra pintada)
    const totalDepth = fontPx * 0.16;
    const step = totalDepth / DEPTH_LAYERS;
    for(let i = 1; i <= DEPTH_LAYERS; i++){
      const layer = document.createElement('span');
      styleCommon(layer);
      layer.style.transform = 'translateZ(-' + (step * i).toFixed(2) + 'px)';
      layer.style.color = shadeColor(base, -0.075 * i);
      layers.insertBefore(layer, front);
    }

    const wrap = document.createElement('div');
    wrap.className = 'text-stage';
    wrap.style.filter = 'drop-shadow(0 10px 18px rgba(0,0,0,.55))'; // sombra de conjunto, fuera del contexto 3D
    wrap.style.overflow = 'hidden';

    if(wallOn){
      // "pared de pantallas": un único cartel ancho como la suma de todas las
      // pantallas, del que cada pantalla solo enseña el trozo que le toca.
      // Se mantiene un ligero giro fijo (sin animar) para que se note el
      // grosor 3D sin que el efecto de rotación se rompa entre pantallas.
      // Nota: aquí no se aplica el giro/inclinación 3D — con un cartel tan ancho
      // (varias pantallas seguidas) la perspectiva deforma muchísimo los extremos,
      // así que en este modo el texto se ve plano (con el metalizado y el grosor
      // de las letras, pero sin el volumen del giro) para que quede recto de verdad
      // de punta a punta.
      wrap.style.perspective = 'none';
      wrap.style.justifyContent = 'flex-start'; // el lienzo se coloca desde el borde izquierdo, no centrado
      const canvas = document.createElement('div');
      canvas.className = 'wall-canvas';
      canvas.style.width = containerW + 'px';
      canvas.style.height = oneH + 'px';
      canvas.style.flexShrink = '0'; // si no, flexbox lo encoge al ancho de esta única pantalla
      canvas.style.transform = 'translateX(-' + (SCREEN_POS * oneW) + 'px)';
      canvas.appendChild(layers);
      wrap.appendChild(canvas);
    } else {
      const rotor = document.createElement('div');
      rotor.className = 'text-rotor';
      rotor.style.animationDuration = durSec + 's';
      rotor.style.animationDelay = delay + 's';
      rotor.appendChild(layers);
      wrap.appendChild(rotor);
    }

    stage.appendChild(wrap);
  }

  function applyFlash(enabled, fSec, fMs){
    if(flashLoopId){ cancelAnimationFrame(flashLoopId); flashLoopId = null; }
    if(!enabled){ flash.style.display = 'none'; return; }
    flash.style.display = 'block';
    const period = Math.max(20, fSec*1000 + fMs);
    function loop(){
      const phase = Math.floor(Date.now() / period) % 2;
      flash.style.background = phase === 0 ? '#000000' : '#ffffff';
      flashLoopId = requestAnimationFrame(loop);
    }
    loop();
  }

  let lastState = null;

  function applyState(s){
    lastState = s;
    const mode = s.mode || 'url';
    const hasUrl = mode === 'url' && !!(s.url && s.url.trim());
    const isActive = hasUrl || mode === 'black' || mode === 'text' || !!s.flash;

    idle.style.display = isActive ? 'none' : 'flex';

    if(mode === 'black'){
      if(current !== 'black'){ mountBlack(); current = 'black'; }
    } else if(mode === 'text' && s.text){
      const key = 'text|' + JSON.stringify(s.text) + '|' + JSON.stringify(s.wall || null);
      if(current !== key){ mountText(s.text, s.wall); current = key; }
    } else if(hasUrl){
      const key = s.url + '|' + s.type + '|' + s.t0;
      if(current !== key){ mountContent(s.url.trim(), s.type, s.t0); current = key; }
    } else if(current !== null){
      clearStage();
      current = null;
    }

    applyFlash(!!s.flash, Number(s.fSec)||0, Number(s.fMs)||0);
  }

  // si cambia la resolución de la pantalla (o al arrancar el visor del mod),
  // recalculamos el tamaño del texto para que siga aprovechando todo el hueco
  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(lastState && lastState.mode === 'text' && lastState.text){
        mountText(lastState.text, lastState.wall);
      }
    }, 200);
  });

  let lastRaw = null;
  async function poll(){
    try{
      const res = await fetch(STATE_URL, {cache:'no-store'});
      if(res.ok){
        const raw = await res.text();
        if(raw !== 'null' && raw !== lastRaw){
          lastRaw = raw;
          applyState(JSON.parse(raw));
        }
        idleStatus.textContent = raw === 'null' ? 'esperando primera configuración…' : 'en línea';
        idleStatus.classList.remove('off');
      } else {
        idleStatus.textContent = 'el servidor respondió con error (' + res.status + ')';
        idleStatus.classList.add('off');
      }
    }catch(e){
      idleStatus.textContent = 'sin conexión, reintentando…';
      idleStatus.classList.add('off');
    }
    setTimeout(poll, 1500);
  }
  poll();
})();
</script>
</body>
</html>
