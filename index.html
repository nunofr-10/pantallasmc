<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Señal</title>
<style>
  :root{
    --bg:#04070d;
    --line:#132033;
    --signal:#3ddc84;
    --amber:#e8a33d;
    --text:#c9d6e3;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#000;overflow:hidden;
    font-family:var(--mono);
  }
  #stage{
    position:fixed;inset:0;background:#000;
  }
  #stage iframe,#stage video,#stage img{
    position:absolute;inset:0;width:100%;height:100%;
    border:0;object-fit:cover;background:#000;
  }
  #flash{
    position:fixed;inset:0;pointer-events:none;
    z-index:50;background:transparent;
  }
  #idle{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:var(--bg);color:var(--text);
    text-align:center;padding:40px;
  }
  #idle .dot{
    width:10px;height:10px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 12px var(--signal);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.4);}
  }
  #idle h1{
    font-size:15px;letter-spacing:.04em;font-weight:500;
    color:var(--text);margin:0;
  }
  #idle code{
    color:var(--amber);font-size:13px;border:1px solid var(--line);
    padding:6px 10px;border-radius:3px;
  }
  #idle p{
    max-width:420px;font-size:12.5px;line-height:1.6;color:#5c7188;margin:0;
  }
  #hud{
    position:fixed;left:14px;bottom:12px;z-index:60;
    font-size:11px;color:#31465e;letter-spacing:.03em;
    display:flex;gap:10px;align-items:center;
    pointer-events:none;
  }
  #hud b{color:#4a6480;}
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="flash"></div>
  <div id="idle">
    <div class="dot"></div>
    <h1>Sin señal de entrada</h1>
    <code id="cfgLink">/config.html</code>
    <p>Esta pantalla espera una URL generada desde la configuración. Ábrela ahí, copia el enlace resultante y cárgalo aquí.</p>
  </div>
  <div id="hud"></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const url    = params.get('c') || '';
  const type   = params.get('t') || '';
  const t0     = parseInt(params.get('t0') || '0', 10) || Date.now();
  const flashOn= params.get('f') === '1';
  const fSec   = Math.max(0, parseFloat(params.get('fs') || '0') || 0);
  const fMs    = Math.max(0, parseInt(params.get('fm') || '0', 10) || 0);
  const period = Math.max(20, fSec*1000 + fMs);

  const stage = document.getElementById('stage');
  const idle  = document.getElementById('idle');
  const hud   = document.getElementById('hud');
  const flash = document.getElementById('flash');

  // resolve config link relative to this page's folder
  document.getElementById('cfgLink').textContent =
    location.href.replace(/[^/]*$/, 'config.html');

  function detectType(u){
    if(/youtu\.?be/i.test(u)) return 'youtube';
    if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)) return 'video';
    if(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(u)) return 'image';
    return 'iframe';
  }

  function youtubeId(u){
    const m = u.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function startFlash(){
    if(!flashOn) return;
    function tick(){
      const phase = Math.floor(Date.now() / period) % 2;
      flash.style.background = phase === 0 ? '#000' : '#fff';
      flash.style.mixBlendMode = phase === 0 ? 'normal' : 'difference';
      requestAnimationFrame(tick);
    }
    // simpler: hard black/white swap, no blend needed
    function loop(){
      const phase = Math.floor(Date.now() / period) % 2;
      flash.style.background = phase === 0 ? '#000000' : '#ffffff';
      requestAnimationFrame(loop);
    }
    loop();
  }

  function showHud(kind){
    hud.innerHTML = '<b>tipo</b> ' + kind + ' &nbsp; <b>ref</b> ' + new Date(t0).toLocaleTimeString();
  }

  function mountYoutube(u){
    const id = youtubeId(u);
    if(!id){ mountIframe(u); return; }
    showHud('youtube');
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    let player, resynced = false;
    window.onYouTubeIframeAPIReady = function(){
      player = new YT.Player('yt-target', {
        videoId: id,
        playerVars:{autoplay:1, controls:0, mute:1, playsinline:1, rel:0, modestbranding:1},
        events:{
          onReady: function(e){
            e.target.mute();
            e.target.playVideo();
            syncNow(e.target);
            setInterval(function(){ syncNow(e.target); }, 5000);
          }
        }
      });
    };
    function syncNow(p){
      try{
        const dur = p.getDuration();
        if(!dur) return;
        const elapsed = ((Date.now() - t0) / 1000) % dur;
        const drift = Math.abs(p.getCurrentTime() - elapsed);
        if(drift > 1) p.seekTo(elapsed, true);
      }catch(e){}
    }
    const holder = document.createElement('div');
    holder.id = 'yt-target';
    holder.style.cssText='position:absolute;inset:0;width:100%;height:100%;';
    stage.appendChild(holder);
  }

  function mountVideo(u){
    showHud('video');
    const v = document.createElement('video');
    v.src = u; v.muted = true; v.autoplay = true; v.playsInline = true; v.loop = false;
    stage.appendChild(v);
    v.addEventListener('loadedmetadata', function(){
      const dur = v.duration || 0;
      function sync(){
        if(!dur) return;
        const elapsed = ((Date.now() - t0) / 1000) % dur;
        if(Math.abs(v.currentTime - elapsed) > 1) v.currentTime = elapsed;
      }
      sync();
      v.play().catch(()=>{});
      setInterval(sync, 5000);
    });
  }

  function mountImage(u){
    showHud('imagen');
    const img = document.createElement('img');
    img.src = u;
    stage.appendChild(img);
  }

  function mountIframe(u){
    showHud('web');
    const f = document.createElement('iframe');
    f.src = u;
    f.setAttribute('allow','autoplay; fullscreen');
    stage.appendChild(f);
  }

  if(url){
    idle.style.display = 'none';
    const kind = type || detectType(url);
    if(kind === 'youtube') mountYoutube(url);
    else if(kind === 'video') mountVideo(url);
    else if(kind === 'image') mountImage(url);
    else mountIframe(url);
  }

  startFlash();
})();
</script>
</body>
</html>
