<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Señal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Audiowide&family=Bebas+Neue&family=Montserrat:wght@900&family=Orbitron:wght@700;900&family=Poppins:wght@800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04070d; --line:#132033; --signal:#3ddc84; --amber:#e8a33d;
    --text:#c9d6e3; --dim:#5c7188; --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--mono);}
  #stage{position:fixed;inset:0;background:#000;}
  #stage iframe,#stage video,#stage img{
    position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#000;
  }
  #flash{position:fixed;inset:0;pointer-events:none;z-index:50;background:transparent;display:none;}
  .text-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;}
  .text-rotor{
    transform-style:preserve-3d;animation-name:spin360;animation-timing-function:linear;
    animation-iteration-count:infinite;padding:0 6vw;will-change:transform;
  }
  .text-layers{display:grid;transform-style:preserve-3d;}
  .text-layers span{
    grid-area:1 / 1;display:block;line-height:1.15;text-align:center;white-space:pre;
    backface-visibility:visible;
  }
  @keyframes spin360{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}
  #idle{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:var(--bg);color:var(--text);text-align:center;padding:40px;
  }
  #idle .dot{
    width:10px;height:10px;border-radius:50%;background:var(--signal);
    box-shadow:0 0 12px var(--signal);animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:1;transform:scale(1.4);}}
  #idle h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.02em;}
  #idle p{max-width:420px;font-size:12.5px;line-height:1.6;color:var(--dim);margin:0;}
  #idle code{color:var(--amber);font-size:12px;}
  #idleStatus{font-size:11px;color:#31465e;letter-spacing:.03em;}
  #idleStatus.off{color:#7a2e2e;}
  #setup{
    position:fixed;inset:0;background:var(--bg);color:var(--text);display:flex;
    align-items:center;justify-content:center;padding:40px;text-align:center;
  }
  #setup p{max-width:460px;font-size:13px;line-height:1.7;color:var(--dim);}
  #setup code{color:var(--amber);}
</style>
</head>
<body>

<!-- ============================================================
     Pega aquí la Database URL de tu proyecto Firebase, la misma
     que uses en config.html. Ej:
     "https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app"
     (sin barra al final)
     ============================================================ -->
<script>const DB_URL = "https://pantallasmc-ed9ec-default-rtdb.firebaseio.com";</script>

  <div id="stage"></div>
  <div id="flash"></div>
  <div id="idle">
    <div class="dot"></div>
    <h1>Sin señal de entrada</h1>
    <p>Configúralo desde <code>config.html</code>. En cuanto guardes algo ahí, esta pantalla lo mostrará sola.</p>
    <span id="idleStatus">conectando…</span>
  </div>

<script>
(function(){
  if(!DB_URL){
    document.body.innerHTML =
      '<div id="setup"><p>Falta configurar <code>DB_URL</code> en este archivo con la Database URL'+
      ' de tu proyecto Firebase (la misma que pongas en <code>config.html</code>).</p></div>';
    return;
  }

  const STATE_URL = DB_URL.replace(/\/$/, '') + '/estado.json';

  // identificador de esta pantalla dentro del mapa que se define en config.html (?id=...)
  const SCREEN_ID = (new URLSearchParams(location.search).get('id') || '').trim();

  const stage  = document.getElementById('stage');
  const idle   = document.getElementById('idle');
  const flash  = document.getElementById('flash');
  const idleStatus = document.getElementById('idleStatus');

  let current = null;
  let flashLoopId = null;

  // --- "logs" para control.html: cada pantalla informa de su propio estado
  // en un nodo aparte (/logs/<id>), para no chocar nunca con el guardado de
  // config.html (que siempre reescribe /estado.json entero). No se manda
  // cada 1.5s sin más: solo cuando cambia el mensaje, o como mucho cada 4s
  // para que control.html pueda ver que la pantalla sigue viva.
  const LOGS_URL = SCREEN_ID ? (DB_URL.replace(/\/$/, '') + '/logs/' + encodeURIComponent(SCREEN_ID) + '.json') : null;
  const LOG_HEARTBEAT_MS = 4000;
  let lastLogSig = null, lastLogTs = 0;
  function logStatus(status, msg){
    if(!LOGS_URL) return;
    const now = Date.now();
    const sig = status + '|' + msg;
    if(sig === lastLogSig && (now - lastLogTs) < LOG_HEARTBEAT_MS) return;
    lastLogSig = sig;
    lastLogTs = now;
    fetch(LOGS_URL, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ts: now, status: status, msg: msg})
    }).catch(function(){});
  }

  function detectType(u){
    if(/youtu\.?be/i.test(u)) return 'youtube';
    if(/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(u)) return 'video';
    if(/\.(jpg|jpeg|png|gif|webp|svg)(\?.*)?$/i.test(u)) return 'image';
    return 'iframe';
  }
  function youtubeId(u){
    const m = u.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function clearStage(){ stage.innerHTML = ''; stage.style.background = '#000'; }

  function mountContent(url, type, t0){
    clearStage();
    const kind = type || detectType(url);
    if(kind === 'youtube') mountYoutube(url, t0);
    else if(kind === 'video') mountVideo(url, t0);
    else if(kind === 'image') mountImage(url);
    else mountIframe(url);
  }

  function mountYoutube(u, t0){
    const id = youtubeId(u);
    if(!id){ mountIframe(u); return; }
    const holder = document.createElement('div');
    holder.id = 'yt-target';
    holder.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
    stage.appendChild(holder);

    // detección de anuncios: YouTube no da un "estoy en un anuncio" directo,
    // pero mientras se reproduce un anuncio, getVideoData() devuelve el id
    // de ESE anuncio en vez del vídeo que pedimos — si no coinciden, es un
    // anuncio. En ese caso tapamos la pantalla con un negro por encima (no
    // podemos saltarlo) y lo avisamos en el panel de control.
    //
    // Para evitar falsos positivos (que se ponga en negro sin haber anuncio
    // de verdad, por ejemplo justo al cargar o en un instante suelto en el
    // que el reproductor aún no ha actualizado sus datos), un desajuste
    // aislado no cuenta: hacen falta DOS lecturas seguidas confirmando lo
    // mismo, y solo se mira cuando el vídeo está realmente reproduciéndose.
    let adOverlay = null;
    let adActive = false;
    let mismatchStreak = 0;
    function showAd(){
      if(adOverlay) return;
      adOverlay = document.createElement('div');
      adOverlay.style.cssText = 'position:absolute;inset:0;background:#000;z-index:5;';
      stage.appendChild(adOverlay);
    }
    function hideAd(){
      if(adOverlay && adOverlay.parentNode) adOverlay.parentNode.removeChild(adOverlay);
      adOverlay = null;
    }
    function checkAd(p){
      try{
        const state = p.getPlayerState();
        // -1 sin empezar, 0 terminado, 5 en cola: en esos momentos
        // getVideoData() puede no reflejar todavía lo que se está viendo de
        // verdad, así que no se usan para decidir si hay anuncio o no
        if(state !== 1 && state !== 2 && state !== 3) return adActive;

        const data = p.getVideoData();
        const playingId = data && data.video_id;
        const mismatch = !!(playingId && playingId !== id);
        mismatchStreak = mismatch ? (mismatchStreak + 1) : 0;

        if(mismatchStreak >= 2 && !adActive){
          adActive = true;
          showAd();
          logStatus('ad', 'anuncio detectado — pantalla en negro');
        } else if(!mismatch && adActive){
          adActive = false;
          hideAd();
          logStatus('ok', 'anuncio terminado — vídeo reanudado');
        }
        return adActive;
      }catch(e){ return adActive; }
    }
    function tick(p){
      const isAd = checkAd(p);
      if(!isAd){
        syncNow(p, t0);
        logStatus('ok', 'vídeo sincronizado correctamente');
      }
    }

    function boot(){
      new YT.Player('yt-target', {
        videoId: id,
        playerVars:{autoplay:1, controls:0, mute:1, playsinline:1, rel:0, modestbranding:1},
        events:{
          onReady: function(e){
            e.target.mute();
            e.target.playVideo();
            tick(e.target);
            setInterval(function(){ tick(e.target); }, 5000);
          },
          onStateChange: function(e){ checkAd(e.target); }
        }
      });
    }
    if(window.YT && window.YT.Player) boot();
    else{
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
      window.onYouTubeIframeAPIReady = boot;
    }
  }

  function syncNow(p, t0){
    try{
      const dur = p.getDuration();
      if(!dur) return;
      const elapsed = ((Date.now() - t0) / 1000) % dur;
      if(Math.abs(p.getCurrentTime() - elapsed) > 1) p.seekTo(elapsed, true);
    }catch(e){}
  }

  function mountVideo(u, t0){
    const v = document.createElement('video');
    v.src = u; v.muted = true; v.autoplay = true; v.playsInline = true;
    stage.appendChild(v);
    v.addEventListener('loadedmetadata', function(){
      const dur = v.duration || 0;
      function sync(){
        if(!dur) return;
        const elapsed = ((Date.now() - t0) / 1000) % dur;
        if(Math.abs(v.currentTime - elapsed) > 1) v.currentTime = elapsed;
        logStatus('ok', 'vídeo sincronizado correctamente');
      }
      sync();
      v.play().catch(()=>{});
      setInterval(sync, 5000);
    });
  }

  function mountImage(u){
    const img = document.createElement('img');
    img.src = u;
    stage.appendChild(img);
  }

  function mountIframe(u){
    const f = document.createElement('iframe');
    f.src = u;
    f.setAttribute('allow', 'autoplay; fullscreen');
    stage.appendChild(f);
  }

  function mountBlack(){
    clearStage();
    stage.style.background = '#000';
  }

  // --- utilidades para el efecto metálico ---
  function shadeColor(hex, percent){
    hex = String(hex || '#e5e9ee').replace('#', '');
    if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
    const num = parseInt(hex, 16) || 0xe5e9ee;
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    if(percent >= 0){
      r = Math.round(r + (255 - r) * percent);
      g = Math.round(g + (255 - g) * percent);
      b = Math.round(b + (255 - b) * percent);
    } else {
      const p = 1 + percent;
      r = Math.round(r * p);
      g = Math.round(g * p);
      b = Math.round(b * p);
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function metallicGradient(hex){
    return [
      shadeColor(hex, 0.88),
      shadeColor(hex, 0.15),
      shadeColor(hex, -0.55),
      shadeColor(hex, 0.4),
      shadeColor(hex, -0.65),
      shadeColor(hex, 0.1),
      shadeColor(hex, 0.88)
    ].join(', ');
  }

  // peso de fuente por familia: todas quedan en negrita, real o sintética
  const FONT_WEIGHTS = {
    "'Orbitron',sans-serif": 900,
    "'Audiowide',sans-serif": 400,
    "'Russo One',sans-serif": 400,
    "'Anton',sans-serif": 400,
    "'Bebas Neue',sans-serif": 700,
    "'Montserrat',sans-serif": 900,
    "'Poppins',sans-serif": 800
  };

  const DEPTH_LAYERS = 5; // nº de capas que forman el grosor del texto en 3D

  // pantallas que siguen la configuración general (sin "⚙" propio), en orden
  // de izquierda a derecha y de arriba a abajo — ese orden es el que decide
  // qué letra le toca a cada una en el modo "repartir"
  function computeScreenSlots(screens){
    return Object.keys(screens || {}).map(function(id){
      return Object.assign({id: id}, screens[id]);
    }).filter(function(sc){
      return sc.enabled !== false && !sc.cfg && Number(sc.w) > 0 && Number(sc.h) > 0;
    }).sort(function(a, b){
      const ax = Number(a.x) || 0, bx = Number(b.x) || 0;
      if(ax !== bx) return ax - bx;
      return (Number(a.y) || 0) - (Number(b.y) || 0);
    });
  }

  // calcula, midiendo de verdad en el DOM, el mayor tamaño de fuente (px) que
  // cabe en un contenedor de containerW x containerH sin desbordar ni recortarse.
  // fillW/fillH (0-1) son cuánto de ese hueco se deja ocupar; con un margen
  // mayor las letras quedan más separadas entre sí (útil en el modo repartir,
  // donde cada letra vive en su propia pantalla, para que no se vean pegadas
  // al borde y demasiado juntas entre pantallas contiguas).
  function fitFontSizePx(lines, font, weight, containerW, containerH, fillW, fillH){
    if(fillW === undefined) fillW = 0.92;
    if(fillH === undefined) fillH = 0.82;
    const REF = 200;
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;white-space:pre;' +
      'line-height:1.15;font-size:' + REF + 'px;font-family:' + font + ';font-weight:' + weight + ';letter-spacing:0.02em;';
    document.body.appendChild(probe);
    let maxLineW = 1;
    lines.forEach(function(line){
      probe.textContent = line || ' ';
      maxLineW = Math.max(maxLineW, probe.scrollWidth);
    });
    const lineHeightAtRef = REF * 1.15;
    const totalHeightAtRef = lineHeightAtRef * lines.length;
    document.body.removeChild(probe);

    const scale = Math.min((containerW * fillW) / maxLineW, (containerH * fillH) / totalHeightAtRef);
    return Math.max(8, REF * scale);
  }

  function mountText(t, spreadEnabled, screens, mine){
    clearStage();
    stage.style.background = t.bg || '#000000';
    const durSec = Math.max(0.5, Number(t.rotateSec) || 8);
    const delay = -((Date.now() % (durSec*1000)) / 1000);

    const base = t.color || '#e5e9ee';
    const font = t.font || "'Orbitron',sans-serif";
    const metal = t.metal !== false; // por defecto activado
    const weight = FONT_WEIGHTS[font] || 900;
    const containerW = window.innerWidth;
    const containerH = window.innerHeight;

    // en modo "repartir": el texto es UN cartel único y continuo que se
    // extiende por todas las pantallas del grupo, no letras sueltas cada una
    // en su hueco. Se calcula el tamaño para que el texto completo quepa en
    // el ancho/alto combinado de TODAS esas pantallas (medido en bloques del
    // mapa, convertido a los píxeles reales de ESTA pantalla según su propia
    // densidad de píxeles por bloque) y se centra ahí; esta pantalla solo
    // muestra el trozo que le toca según su posición, como una ventana que
    // se mueve sobre un cartel más grande. Si una letra cae justo en el
    // borde entre dos pantallas, se parte por donde caiga — es lo que hace
    // que el conjunto se vea como un cartel de verdad y no como letras
    // sueltas con huecos entre ellas. Al no depender de un giro compartido
    // (que no se puede sincronizar entre pantallas distintas) se queda
    // quieto, sin girar; el texto normal en una sola pantalla sigue girando
    // en 3D como siempre.
    let content = t.content || '';
    let fontPx = null;
    let wallGeo = null; // {canvasW, canvasH, offsetXpx, offsetYpx} si se está repartiendo
    if(spreadEnabled && mine && containerW > 0 && containerH > 0){
      const slots = computeScreenSlots(screens);
      const idx = slots.findIndex(function(sc){ return sc.id === SCREEN_ID; });
      if(slots.length >= 2 && idx !== -1){
        const minX = Math.min.apply(null, slots.map(function(sc){ return Number(sc.x) || 0; }));
        const maxX = Math.max.apply(null, slots.map(function(sc){ return (Number(sc.x) || 0) + (Number(sc.w) || 1); }));
        const minY = Math.min.apply(null, slots.map(function(sc){ return Number(sc.y) || 0; }));
        const maxY = Math.max.apply(null, slots.map(function(sc){ return (Number(sc.y) || 0) + (Number(sc.h) || 1); }));
        const totalBlockW = Math.max(1, maxX - minX);
        const totalBlockH = Math.max(1, maxY - minY);
        const myBlockW = Number(mine.w) || 1, myBlockH = Number(mine.h) || 1;
        const pxPerBlockX = containerW / myBlockW;
        const pxPerBlockY = containerH / myBlockH;
        const canvasW = totalBlockW * pxPerBlockX;
        const canvasH = totalBlockH * pxPerBlockY;

        fontPx = fitFontSizePx(content.split('\n'), font, weight, canvasW, canvasH, 0.94, 0.86);
        wallGeo = {
          canvasW: canvasW, canvasH: canvasH,
          offsetXpx: ((Number(mine.x) || 0) - minX) * pxPerBlockX,
          offsetYpx: ((Number(mine.y) || 0) - minY) * pxPerBlockY
        };
      }
    }

    const lines = content.split('\n');
    if(fontPx === null) fontPx = fitFontSizePx(lines, font, weight, containerW, containerH);

    // construye la "letra" en 3D (cara frontal + capas de grosor) para el
    // texto indicado, reutilizable tanto para el giro normal como para el
    // reparto estático
    function buildLayers(text){
      function styleCommon(el){
        el.textContent = text;
        el.style.fontFamily = font;
        el.style.fontWeight = weight;
        el.style.letterSpacing = '0.02em';
        el.style.fontSize = fontPx + 'px';
      }
      const front = document.createElement('span');
      styleCommon(front);
      front.style.transform = 'translateZ(0.01px)'; // fuerza su propia capa de composición por encima del resto
      if(metal){
        front.style.backgroundImage = 'linear-gradient(180deg, ' + metallicGradient(base) + ')';
        front.style.setProperty('-webkit-background-clip', 'text');
        front.style.backgroundClip = 'text';
        front.style.color = 'transparent';
        front.style.setProperty('-webkit-text-fill-color', 'transparent');
      } else {
        front.style.color = base;
      }
      const layersEl = document.createElement('div');
      layersEl.className = 'text-layers';
      layersEl.appendChild(front);
      const totalDepth = fontPx * 0.16;
      const step = totalDepth / DEPTH_LAYERS;
      for(let i = 1; i <= DEPTH_LAYERS; i++){
        const layer = document.createElement('span');
        styleCommon(layer);
        layer.style.transform = 'translateZ(-' + (step * i).toFixed(2) + 'px)';
        layer.style.color = shadeColor(base, -0.075 * i);
        layersEl.insertBefore(layer, front);
      }
      return layersEl;
    }

    const wrap = document.createElement('div');
    wrap.className = 'text-stage';
    wrap.style.overflow = 'hidden';

    if(spreadEnabled){
      // reparto entre varias pantallas: quieto, sin girar, para que el
      // conjunto se lea como un cartel único en vez de varias letras
      // girando cada una por su cuenta y sin poder ir sincronizadas
      if(wallGeo){
        // el cartel completo se dibuja UNA vez a tamaño del lienzo combinado
        // (wallGeo.canvasW x canvasH) y se desplaza para que, recortado por
        // el overflow:hidden de "wrap" (del tamaño de esta pantalla), se vea
        // solo el trozo que le corresponde a esta pantalla según su posición
        // en el grupo — como una ventana que se mueve sobre un cartel más
        // grande, por eso las letras pueden quedar partidas justo donde cae
        // el borde entre dos pantallas
        const canvas = document.createElement('div');
        canvas.style.position = 'absolute';
        canvas.style.left = (-wallGeo.offsetXpx) + 'px';
        canvas.style.top = (-wallGeo.offsetYpx) + 'px';
        canvas.style.width = wallGeo.canvasW + 'px';
        canvas.style.height = wallGeo.canvasH + 'px';
        canvas.style.display = 'flex';
        canvas.style.alignItems = 'center';
        canvas.style.justifyContent = 'center';
        canvas.style.transformStyle = 'preserve-3d';
        canvas.appendChild(buildLayers(content));
        wrap.appendChild(canvas);
      } else {
        // reserva (p.ej. solo esta pantalla activa, o aún sin resolución
        // real medida): se ve el texto completo centrado, sin recortar
        const still = document.createElement('div');
        still.style.transformStyle = 'preserve-3d';
        still.appendChild(buildLayers(content));
        wrap.appendChild(still);
      }
    } else {
      // texto normal en una sola pantalla: centrado y girando en 3D, como
      // siempre
      const rotor = document.createElement('div');
      rotor.className = 'text-rotor';
      rotor.style.animationDuration = durSec + 's';
      rotor.style.animationDelay = delay + 's';
      rotor.appendChild(buildLayers(content));
      wrap.appendChild(rotor);
    }

    stage.appendChild(wrap);
  }

  function applyFlash(enabled, fSec, fMs){
    if(flashLoopId){ cancelAnimationFrame(flashLoopId); flashLoopId = null; }
    if(!enabled){ flash.style.display = 'none'; return; }
    flash.style.display = 'block';
    const period = Math.max(20, fSec*1000 + fMs);
    function loop(){
      const phase = Math.floor(Date.now() / period) % 2;
      flash.style.background = phase === 0 ? '#000000' : '#ffffff';
      flashLoopId = requestAnimationFrame(loop);
    }
    loop();
  }

  let lastState = null;

  function applyState(s){
    lastState = s;
    const screens = s.screens || {};
    const mine = SCREEN_ID ? screens[SCREEN_ID] : null;

    // pantalla apagada a mano desde el mapa: negro y nada más, sea cual sea el modo
    if(mine && mine.enabled === false){
      idle.style.display = 'none';
      if(current !== 'off'){ clearStage(); current = 'off'; }
      applyFlash(false, 0, 0);
      logStatus('off', 'apagada manualmente desde el mapa');
      return;
    }

    // si esta pantalla tiene su propia configuración (botón "⚙" individual en
    // config.html), se usa esa en vez de la configuración general de todas
    const usingOwn = !!(mine && mine.cfg && mine.cfg.mode);
    const cfg = usingOwn ? mine.cfg : s;

    const mode = cfg.mode || 'url';
    const hasUrl = mode === 'url' && !!(cfg.url && cfg.url.trim());
    const isActive = hasUrl || mode === 'black' || mode === 'text' || !!s.flash;

    idle.style.display = isActive ? 'none' : 'flex';

    if(mode === 'black'){
      if(current !== 'black'){ mountBlack(); current = 'black'; }
      logStatus('black', 'pantalla en negro');
    } else if(mode === 'text' && cfg.text){
      // repartir el texto entre pantallas solo tiene sentido para las que
      // siguen la configuración general; una pantalla con configuración
      // propia se queda fuera del reparto y no debe depender para nada del
      // mapa general: por eso el mapa de pantallas solo entra en la "llave"
      // de recambio cuando realmente se está repartiendo. Si no, aunque el
      // contenido ya estuviera correctamente aislado, cualquier cambio en el
      // mapa (mover una pantalla, activar/desactivar el reparto general...)
      // volvía a montar esta pantalla igualmente y se notaba como un salto
      // o un reinicio del giro, sin que su propio contenido hubiera cambiado
      const spread = !usingOwn && !!(s.wall && s.wall.enabled);
      const key = 'text|' + JSON.stringify(cfg.text) + '|' + spread + (spread ? ('|' + JSON.stringify(screens)) : '');
      if(current !== key){ mountText(cfg.text, spread, screens, mine); current = key; }
      logStatus('ok', spread ? 'mostrando texto repartido entre pantallas' : 'mostrando texto');
    } else if(hasUrl){
      const key = cfg.url + '|' + cfg.type + '|' + cfg.t0;
      const kind = cfg.type || detectType(cfg.url.trim());
      if(current !== key){
        mountContent(cfg.url.trim(), cfg.type, cfg.t0);
        current = key;
        if(kind === 'youtube' || kind === 'video') logStatus('ok', 'cargando vídeo…');
      }
      // el vídeo (youtube/mp4) informa de su propio progreso (sincronizado /
      // anuncio detectado) desde su bucle de sincronización; aquí solo
      // cubrimos los tipos que no tienen ese bucle propio
      if(kind === 'image') logStatus('ok', 'mostrando imagen');
      else if(kind === 'iframe') logStatus('ok', 'mostrando página web');
    } else {
      if(current !== null){ clearStage(); current = null; }
      logStatus('idle', 'sin señal de entrada');
    }

    applyFlash(!!s.flash, Number(s.fSec)||0, Number(s.fMs)||0);
  }

  // si cambia la resolución de la pantalla (o al arrancar el visor del mod),
  // recalculamos el tamaño del texto para que siga aprovechando todo el hueco
  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if(!lastState) return;
      const screens = lastState.screens || {};
      const mine = SCREEN_ID ? screens[SCREEN_ID] : null;
      const usingOwn = !!(mine && mine.cfg && mine.cfg.mode);
      const cfg = usingOwn ? mine.cfg : lastState;
      if(cfg.mode === 'text' && cfg.text){
        const spread = !usingOwn && !!(lastState.wall && lastState.wall.enabled);
        mountText(cfg.text, spread, screens, mine);
      }
    }, 200);
  });

  let lastRaw = null;

  // vigilante: si por lo que sea el sondeo se queda colgado (por ejemplo un
  // fetch() que en el navegador embebido del mod no llega nunca a resolverse,
  // ni bien ni mal) esta pantalla dejaría de actualizarse para siempre sin
  // que el propio bucle pueda darse cuenta. lastPollTick se actualiza cada
  // vez que el sondeo TERMINA una vuelta (haya ido bien o mal); un temporizador
  // aparte, independiente de ese bucle, comprueba que no lleve más de 10s sin
  // moverse — justo el margen que usa el panel de control para avisar de "sin
  // respuesta" — y si es así recarga la página entera para recuperarla. Una
  // pantalla que sí está respondiendo con normalidad nunca llega a ese punto,
  // así que esto no afecta a la reproducción de nada que esté funcionando bien
  // (y si se recarga un vídeo, el propio sincronizado por tiempo real hace que
  // retome donde tocaba, no desde el principio).
  let lastPollTick = Date.now();
  const WATCHDOG_MS = 10000;
  setInterval(function(){
    if(Date.now() - lastPollTick > WATCHDOG_MS) location.reload();
  }, 2000);

  async function poll(){
    try{
      const res = await fetch(STATE_URL, {cache:'no-store'});
      if(res.ok){
        const raw = await res.text();
        if(raw !== 'null' && raw !== lastRaw){
          // el estado se marca como "visto" solo si se ha podido aplicar sin
          // errores; si algo falla al montarlo, se reintenta en el siguiente
          // sondeo en vez de quedarse atascado mostrando negro para siempre
          applyState(JSON.parse(raw));
          lastRaw = raw;
        }
        idleStatus.textContent = raw === 'null' ? 'esperando primera configuración…' : 'en línea';
        idleStatus.classList.remove('off');
        if(raw === 'null') logStatus('idle', 'esperando primera configuración…');
      } else {
        idleStatus.textContent = 'el servidor respondió con error (' + res.status + ')';
        idleStatus.classList.add('off');
        logStatus('error', 'el servidor respondió con error (' + res.status + ')');
      }
    }catch(e){
      idleStatus.textContent = 'sin conexión, reintentando…';
      idleStatus.classList.add('off');
      logStatus('offline', 'sin conexión, reintentando…');
    }
    lastPollTick = Date.now();
    setTimeout(poll, 1500);
  }
  poll();
})();
</script>
</body>
</html>
